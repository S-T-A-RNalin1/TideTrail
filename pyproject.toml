[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tidetrail"
version = "2.0.0"
description = "Deep learning super-resolution of 10 m Sentinel-2 imagery to 2.5 m with per-pixel uncertainty. SIH26142, NTRO, Space Technology."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "python-multipart>=0.0.9",
  "numpy>=1.26",
  "scipy>=1.11",
  "torch>=2.1",
  "rasterio>=1.3",
  "pyproj>=3.6",
  "affine>=2.4",
  "pillow>=10.0",
]

[tool.setuptools]
packages = ["app", "app.api", "app.sr"]
